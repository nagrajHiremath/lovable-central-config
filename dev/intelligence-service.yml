server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/intelligence_db
    username: intelligence_user
    password: intelligence_password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: google/gemma-4-26b-a4b-it:free
          temperature: 0.2
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${AI_API_KEY}
